# Render Blueprint for the CCN Bun + Hono API — a persistent Docker web service
# with native WebSocket support (Render does not spin the process down on an
# idle connection, unlike a serverless/edge runtime), needed for the WS hub and
# the single dedicated postgres.js LISTEN connection (apps/api/src/ws/bridge.ts).
#
# Chosen over Fly.io for this deadline: a simpler first deploy (git-push /
# Blueprint, no machine-lifecycle tuning) and first-class Cron Jobs for the
# nightly-sweep work already deferred to a later phase. Region (Ohio) is
# comparable latency to Supabase us-east-1 as Fly's `iad`. See the go-live
# plan's "Hosting" addendum.
#
# Plan: `free`, by deliberate choice for the initial prod-testable pass — $0,
# but the trade-off is real: the service spins down after ~15 min idle, so the
# first request after a quiet period eats a ~30-60s cold start, and the
# dedicated LISTEN/NOTIFY connection drops and has to reconnect on wake (the
# WS hub's realtime push is not reliably always-on). Bump to `starter` ($7/mo,
# no spin-down) once always-on realtime matters more than cost.
#
# Deploy: connect this repo in the Render dashboard (or `render blueprint launch`),
# root directory `.` so the Docker build context is the whole monorepo, Dockerfile
# path `apps/api/Dockerfile`.
#
# Migrations do NOT run on deploy. See the note beside the service below: Render
# does not support pre-deploy commands on `free`, so after any merge that adds a
# migration, somebody runs
#
#   cd packages/db && DATABASE_URL='<production url>' bun run db:migrate
#
# Seeding is manual for a different and permanent reason: re-running it on every
# deploy would write fixture rows over real user data. On a live database use the
# catalog only — `bun run db:seed:reference` — or the "Load the catalog" action
# on the administration surface, which does the same thing over HTTP.
#
# `packages/config` fails fast on boot (before serving a single request) if any
# required value below is missing — set ALL of these in the Render dashboard,
# never committed here:
#   Secrets:   DATABASE_URL, BETTER_AUTH_SECRET, GOOGLE_CLIENT_ID,
#              GOOGLE_CLIENT_SECRET, OPENAI_API_KEY, FIELD_ENCRYPTION_KEY
#              FIELD_ENCRYPTION_KEY must decode to exactly 32 bytes: use either
#              64 hex characters or base64/base64url for 32 random bytes, with
#              no "hex:" or "base64:" prefix. See /.env.example for a generator.
#   Required, not secret (no default — easy to miss since they aren't secrets):
#     SUPABASE_URL     the Supabase project URL (also SSRF-allowlisted, apps/api/src/security.ts)
#     BETTER_AUTH_URL  the WEB app's public origin, e.g.
#                      https://caribbean-capital-network-platform.vercel.app — NOT this
#                      Render service's own URL. apps/web/next.config.mjs proxies /api/*
#                      to this service so the session cookie stays same-origin from the
#                      browser's point of view; Better Auth derives the OAuth callback URL
#                      and the cookie's implicit domain from BETTER_AUTH_URL, so it has to
#                      match wherever the browser actually is, not where this service runs.
#                      The Google Cloud Console OAuth client's Authorized redirect URI must
#                      match too: `${BETTER_AUTH_URL}/api/auth/callback/google`.
#   Defaults to http://localhost:3000 if unset — MUST be overridden in prod or
#   CORS/Better-Auth's trustedOrigins (apps/api/src/app.ts, apps/api/src/auth.ts)
#   silently reject every request from the deployed web app:
#     APP_WEB_ORIGIN   the production web origin (the Vercel domain) — used for CORS only,
#                      still the actual web app's own origin (unlike BETTER_AUTH_URL above)
#   Optional (safe defaults — OPENAI_BASE_URL, AI_MODEL, AI_EMBED_MODEL,
#   SUPABASE_STORAGE_BUCKET, DB_APP_ROLE, SENTRY_DSN).
services:
  - type: web
    name: ccn-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # The branch this service deploys.
    #
    # Stated here rather than left implicit, because "which branch is actually
    # live" was a real source of confusion: the API was deploying from a feature
    # branch while the repository's default branch was main, nothing in the
    # repository said so, and a fix that looked shipped was not. A deploy source
    # that only exists in a dashboard is a fact about the system that no one
    # reading the code can check.
    #
    # For a service Render created from this blueprint, this is authoritative on
    # the next sync. For one created in the dashboard, the dashboard setting
    # wins and this documents the intent until they are reconciled — so changing
    # this line is not on its own proof that the deploy source moved. Confirm in
    # Render → ccn-api → Settings → Build & Deploy → Branch.
    branch: main
    # NO preDeployCommand — and this is the most important line in the file.
    #
    # Render does not support pre-deploy commands on the free instance type, so
    # `preDeployCommand: cd packages/db && bun run db:migrate` made this
    # Blueprint invalid and every sync failed. That failure is silent in the
    # only place anyone looks: the service kept deploying from its dashboard
    # configuration, builds stayed green, and NOTHING EVER APPLIED MIGRATIONS.
    #
    # It surfaced the way it always does — as a 500 in front of a person. An
    # administrator pressed "Onboard a partner" against a database that had
    # never received 0010's grant and got `permission denied for table
    # partners`, while every read on the same screen answered 200.
    #
    # So while this service is on `free`, MIGRATIONS ARE A MANUAL STEP after any
    # merge that adds one:
    #
    #     cd packages/db && DATABASE_URL='<production url>' bun run db:migrate
    #
    # Do not re-add it while this service is on `free`. It does not fail loudly
    # — it fails as a Blueprint that never syncs, which reads exactly like
    # everything working, and that is how this was missed the first time.
    #
    # A paid instance type is the only configuration in which Render will accept
    # it, so if automatic migrations are ever wanted, the plan is the thing that
    # has to change first:
    #
    #     preDeployCommand: cd packages/db && bun run db:migrate
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "3001"
      # Render's reverse proxy sets the standard X-Forwarded-For header — the
      # client-IP resolver (apps/api/src/security.ts) is provider-agnostic by
      # design, so this is the only line that changes moving off Fly.
      - key: TRUSTED_CLIENT_IP_HEADER
        value: x-forwarded-for
