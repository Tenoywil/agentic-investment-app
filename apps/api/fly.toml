# Fly.io config for the CCN Bun + Hono API. Deploy from the repo root so the
# Docker build context includes the whole monorepo:
#   flyctl deploy -c apps/api/fly.toml --dockerfile apps/api/Dockerfile
app = "ccn-api"
primary_region = "iad" # near Supabase us-east-1 to keep DB latency low

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/health"
  interval = "15s"
  timeout = "2s"
