<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caribbean Capital Network. Guided tour</title>
<meta name="description" content="A guided walkthrough of the Caribbean Capital Network platform.">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c211d; --panel:#102a25; --ink:#e9e4d8; --dim:#a8b3a9; --faint:#6f7d73;
    --gold:#d9a441; --teal:#0e5952; --line:rgba(233,228,216,.12);
    --disp:'Bricolage Grotesque',Georgia,serif;
    --body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100vh;padding:0 clamp(18px,3.4vw,52px)}

  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:0 0 auto;
    padding:18px 0 14px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px}
  .cmark{width:30px;height:30px;border-radius:8px;background:var(--teal);display:flex;align-items:center;
    justify-content:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:16px}
  .brand b{font-family:var(--disp);font-weight:600;font-size:14px;letter-spacing:.2px}
  .brand span{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-left:10px}
  .counter{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--dim)}

  .stage{flex:1 1 auto;display:grid;grid-template-columns:minmax(300px,40%) 1fr;gap:clamp(20px,3vw,56px);
    align-items:center;min-height:0;padding:min(3vh,24px) 0}
  .stage.solo{grid-template-columns:1fr}
  .solo .copy{max-width:660px;margin:0 auto}

  .copy{max-width:540px;animation:rise .45s ease both}
  .stepno{font-family:var(--mono);font-size:12px;letter-spacing:1px;color:var(--faint);margin-bottom:14px}
  .stepno b{color:var(--gold);font-weight:500}
  .title{font-family:var(--disp);font-weight:650;line-height:1.07;letter-spacing:-.4px;
    font-size:clamp(26px,4vw,44px);color:#fff;margin-bottom:14px}
  .solo .title{font-size:clamp(30px,4.8vw,54px)}
  .narr{font-size:clamp(15px,1.25vw,17.5px);line-height:1.65;color:var(--dim);max-width:54ch}
  .em{color:var(--gold);font-weight:600}
  .emc{color:#fff;font-weight:600}

  .list{margin-top:22px;border-top:1px solid var(--line)}
  .list div{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);
    font-size:14.5px;color:var(--ink)}
  .list div::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none;transform:translateY(-2px)}

  .try{display:inline-flex;align-items:center;gap:8px;margin-top:24px;font-size:14px;font-weight:600;
    color:var(--gold);text-decoration:none;border:1px solid rgba(217,164,65,.4);border-radius:8px;padding:10px 16px}
  .try:hover{background:rgba(217,164,65,.08)}
  .try small{font-weight:400;color:var(--dim)}

  .hint{margin-top:26px;font-size:12.5px;color:var(--faint)}
  .hint kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--dim)}

  .device{justify-self:center;width:100%;max-width:min(54vw,720px);animation:rise .5s ease both}
  .frame{position:relative;background:#fff;border-radius:10px;overflow:hidden;
    border:1px solid rgba(233,228,216,.14);box-shadow:0 24px 60px -28px rgba(0,0,0,.65);max-height:76vh}
  .frame .bar{height:30px;background:#e9e3d7;display:flex;align-items:center;gap:6px;padding:0 12px}
  .frame .bar i{width:9px;height:9px;border-radius:50%;background:#cfc7b6}
  .frame .bar span{margin-left:8px;font-family:var(--mono);font-size:10.5px;color:#8a8172}
  .shot{position:relative;overflow:hidden;background:#f5f1e8}
  .shot img{display:block;width:100%;height:auto}
  .hl{position:absolute;border:2px solid var(--gold);border-radius:8px;
    box-shadow:0 0 0 4000px rgba(12,33,29,.38);transition:all .4s ease;pointer-events:none;opacity:0}
  .hl.on{opacity:1}
  .tag{position:absolute;background:var(--gold);color:#33270b;font-weight:700;font-size:11.5px;
    padding:4px 10px;border-radius:5px;white-space:nowrap;transform:translateY(-50%);opacity:0;transition:opacity .35s .15s}
  .hl.on .tag{opacity:1}

  .approve{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:5;
    display:none;flex-direction:column;align-items:center;gap:10px}
  .approve.show{display:flex}
  .abtn{background:var(--teal);color:#fff;border:none;font-family:var(--body);font-weight:700;font-size:15px;
    padding:12px 26px;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
  .abadge{background:#fff;color:var(--teal);border:1px solid #cfe0d6;border-radius:6px;padding:7px 14px;
    font-weight:600;font-size:13px;opacity:0;transform:translateY(5px);transition:all .35s}
  .abadge.on{opacity:1;transform:none}

  .ctrl{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 0 18px;border-top:1px solid var(--line)}
  .btn{border:1px solid var(--line);background:transparent;color:var(--ink);
    font-family:var(--body);font-weight:600;font-size:14px;padding:10px 18px;border-radius:8px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:rgba(233,228,216,.35)}
  .btn.primary{background:var(--gold);color:#33270b;border-color:var(--gold)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:8px;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(233,228,216,.2);cursor:pointer;transition:.2s}
  .dot.on{background:var(--gold)}
  .right{display:flex;align-items:center;gap:10px}
  .toggle{font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--dim);cursor:pointer;
    border:1px solid var(--line);border-radius:6px;padding:8px 12px;user-select:none}
  .toggle.on{color:#33270b;background:var(--gold);border-color:var(--gold)}
  .pbar{position:fixed;left:0;top:0;height:2px;background:var(--gold);width:0;transition:width .4s;z-index:20}

  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  @media (max-width:900px){
    .stage{grid-template-columns:1fr;gap:18px;overflow-y:auto}
    .device{max-width:100%;order:2}.copy{order:1}
    .frame{max-height:none}
    .hint{display:none}
  }
</style>
</head>
<body>
<div class="pbar" id="pbar"></div>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <div class="cmark">C</div>
      <b>Caribbean Capital Network</b><span>Guided tour</span>
    </div>
    <div class="counter" id="counter">01 / 10</div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="ctrl">
    <button class="btn" id="prev">Back</button>
    <div class="dots" id="dots"></div>
    <div class="right">
      <div class="toggle" id="auto">AUTOPLAY</div>
      <button class="btn primary" id="next">Next</button>
    </div>
  </div>
</div>

<script>
const A = './demo/assets/';
const steps = [
  { solo:true, kicker:'The financial operating system of the Caribbean',
    title:'One agent for your whole Caribbean portfolio.',
    narr:'CCN connects local investors and the global diaspora with regional opportunity. The agent researches and prepares; licensed partners execute and custody. Nothing moves without your limits or your approval.',
    list:['Held at FSC-licensed partners','KYC stays with the regulated firms','Data held in-region'],
    hint:true },

  { img:'landing.png', kicker:'The problem',
    title:'Caribbean wealth lives in fragments.',
    narr:'A bond at NCB, a fund at Sagicor, cash idle at JMMB, a pension half-forgotten. Capital is scattered across a dozen institutions and borders, and most of it is not working.',
    hl:{l:5,t:51,w:46,h:15,tag:'Scattered today',tx:'left'},
    link:{href:'./index.html',label:'Open the live demo'} },

  { img:'home.png', kicker:'One portfolio, every partner',
    title:'Every holding, unified and live.',
    narr:'Net worth, blended yield and allocation across your licensed partners in one view. <span class="emc">A live ledger, not a spreadsheet you maintain.</span>',
    hl:{l:24,t:7.5,w:43,h:23,tag:'Unified net worth',tx:'right'},
    link:{href:'./index.html?view=home',label:'Open this screen in the demo'} },

  { img:'agent.png', kicker:'The capital agent',
    title:'An agent that works the whole region.',
    narr:'It monitors <span class="em">47 instruments across 8 licensed partners</span>, checks each idea against your risk band, and proposes moves in plain language. Projections are labeled as projections. It prepares; it does not promise.',
    hl:{l:25,t:19,w:41,h:22,tag:'Proposes a move',tx:'right'},
    link:{href:'./index.html?view=agent',label:'Ask it something in the demo'} },

  { img:'agent.png', kicker:'Your limits, enforced',
    title:'It acts only inside rules you set.',
    narr:'Auto-invest idle cash up to a cap. Keep a cash floor. Cap any single move. <span class="emc">The agent can propose anything, but can act alone only inside these rules,</span> and every action lands in an audit log you can read.',
    hl:{l:67.5,t:48,w:30.5,h:15,tag:'Your limits and rules',tx:'left'},
    link:{href:'./index.html?view=agent',label:'Toggle the rules in the demo'} },

  { img:'home.png', kicker:'One-tap approval', approve:true,
    title:'Larger moves wait for you.',
    narr:'Anything above your limits becomes an approval card. Approve it in the demo and watch the ledger update: cash moves, the holding appears under the executing partner, and the action is logged.',
    hl:{l:60.5,t:44.5,w:37.5,h:26,tag:'Needs your approval',tx:'left'},
    link:{href:'./index.html?view=home',label:'Try the approval live'} },

  { img:'opportunities.png', kicker:'The marketplace',
    title:'Regional deals, screened and attributed.',
    narr:'Bonds, funds, equity raises, real estate and private credit. Every card names the <span class="emc">executing partner and its regulator</span> before you approve, with minimums and risk bands up front.',
    hl:{l:23.5,t:12.5,w:74.5,h:23,tag:'Partner and regulator on every card',tx:'right'},
    link:{href:'./index.html?view=opportunities',label:'Review a deal in the demo'} },

  { img:'planning.png', kicker:'Plan across borders',
    title:'Built for a life between region and diaspora.',
    narr:'Insurance, retirement, estate, and a <span class="em">diaspora mortgage</span> that recognizes income earned abroad. Goal rings track every plan, and each product is delivered by a licensed provider.',
    hl:{l:23.5,t:69.5,w:74.5,h:18,tag:'Goals on track',tx:'right'},
    link:{href:'./index.html?view=planning',label:'See planning in the demo'} },

  { img:'institutions.png', kicker:'The other side of the marketplace',
    title:'Partners get their own console.',
    narr:'This is not a customer screen. Partners sign in to their own dashboard: <span class="em">incoming order flow they accept and settle</span>, their products and inflows, referred-client KYC, and compliance. Every order here began as a client approval on the investor side. <span class="emc">Both sides of one marketplace.</span>',
    hl:{l:21.5,t:20.5,w:45,h:37,tag:'Live order flow',tx:'right'},
    link:{href:'./index.html?view=institutions',label:'Open the partner console'} },

  { solo:true, kicker:'Where the regulated work lives',
    title:'Partners carry the regulated load. CCN orchestrates it.',
    narr:'This is the deliberate split that keeps CCN light and clients safe. The licensed firms keep the duties they already carry today; CCN makes them usable from one place.',
    list:[
      'KYC and AML stay with the regulated partners. CCN links your verified status with consent instead of re-collecting it',
      'Execution, custody and settlement stay with the FSC-licensed partner on every trade',
      'CCN never holds client money and never executes a trade itself',
      'The agent acts only inside user-set limits, with an immutable audit trail'
    ] },

  { solo:true, kicker:'Caribbean Capital Network',
    title:'A single trusted interface for wealth creation in the Caribbean.',
    narr:'One agent. Every partner. Inside your limits.',
    cta:true }
];

let i = 0, autoplay = false, timer = null;
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const dotsEl = document.getElementById('dots');
const pbar = document.getElementById('pbar');
const nextB = document.getElementById('next');
const prevB = document.getElementById('prev');
const autoB = document.getElementById('auto');

dotsEl.innerHTML = steps.map((_,n)=>`<div class="dot" data-n="${n}"></div>`).join('');
const dots = [...dotsEl.children];
dotsEl.addEventListener('click', e=>{ const n=e.target.dataset.n; if(n!=null) go(+n); });

function render(){
  const s = steps[i];
  stage.className = 'stage' + (s.solo ? ' solo' : '');
  const copy = `
    <div class="copy">
      <div class="stepno"><b>${String(i+1).padStart(2,'0')}</b> · ${s.kicker}</div>
      <h1 class="title">${s.title}</h1>
      <p class="narr">${s.narr}</p>
      ${s.list?`<div class="list">${s.list.map(p=>`<div>${p}</div>`).join('')}</div>`:''}
      ${s.link?`<a class="try" href="${s.link.href}" target="_blank" rel="noopener">${s.link.label} <small>opens the interactive app</small></a>`:''}
      ${s.cta?`<span style="display:flex;gap:10px;flex-wrap:wrap"><a class="try" href="./index.html" target="_blank" rel="noopener">Open the live demo</a><a class="try" href="./investor.html" target="_blank" rel="noopener">Read the investor brief</a></span>`:''}
      ${s.hint?`<p class="hint">Navigate with <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>Space</kbd> · <kbd>A</kbd> autoplay · <kbd>F</kbd> fullscreen</p>`:''}
    </div>`;
  let device = '';
  if(!s.solo){
    const h = s.hl;
    const tagPos = h.tx==='left' ? `left:6px` : `right:6px`;
    device = `
      <div class="device">
        <div class="frame">
          <div class="bar"><i></i><i></i><i></i><span>caribbean-capital-network.app</span></div>
          <div class="shot">
            <img src="${A}${s.img}" alt="">
            <div class="hl on" style="left:${h.l}%;top:${h.t}%;width:${h.w}%;height:${h.h}%">
              <div class="tag" style="top:-1px;${tagPos}">${h.tag}</div>
            </div>
            ${s.approve?`
            <div class="approve" id="approve">
              <button class="abtn" id="abtn">Approve</button>
              <div class="abadge" id="abadge">Routed to NCB. The partner executes and custodies it</div>
            </div>`:''}
          </div>
        </div>
      </div>`;
  }
  stage.innerHTML = s.solo ? copy : copy + device;
  counter.textContent = String(i+1).padStart(2,'0') + ' / ' + String(steps.length).padStart(2,'0');
  dots.forEach((d,n)=>d.classList.toggle('on', n===i));
  pbar.style.width = ((i+1)/steps.length*100) + '%';
  prevB.disabled = i===0;
  nextB.textContent = i===steps.length-1 ? 'Restart' : 'Next';
  if(s.approve) runApprove();
}
function runApprove(){
  const wrap=document.getElementById('approve'), btn=document.getElementById('abtn'), badge=document.getElementById('abadge');
  if(!wrap) return;
  setTimeout(()=>{ wrap.classList.add('show'); },600);
  setTimeout(()=>{ btn.textContent='Approving'; btn.style.opacity=.85; },1700);
  setTimeout(()=>{ btn.textContent='Approved'; },2500);
  setTimeout(()=>{ badge.classList.add('on'); },2900);
}
function go(n){ i=(n+steps.length)%steps.length; render(); }
function next(){ go(i+1); }
function prev(){ go(i-1); }

nextB.onclick = ()=>{ i===steps.length-1 ? go(0) : next(); };
prevB.onclick = prev;
autoB.onclick = toggleAuto;
function toggleAuto(){
  autoplay=!autoplay; autoB.classList.toggle('on',autoplay);
  clearInterval(timer);
  if(autoplay) timer=setInterval(()=>{ i===steps.length-1?(toggleAuto()):next(); },6500);
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'){ prev(); }
  else if(e.key.toLowerCase()==='a'){ toggleAuto(); }
  else if(e.key.toLowerCase()==='f'){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
});
render();
</script>
</body>
</html>
